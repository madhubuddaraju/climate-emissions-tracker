name: Weekly data refresh

# Pulls the latest data from every source, rebuilds the warehouse, re-runs the
# quality checks and commits the regenerated report when the numbers changed.
on:
  schedule:
    - cron: "17 7 * * 1"   # Mondays 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Refresh data and rebuild
        run: make refresh report web
      - name: Verify
        run: make test
      - name: Commit updated report
        run: |
          if git diff --quiet -- reports/ docs/; then
            echo "No changes in the data this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ docs/
          git commit -m "Weekly data refresh: $(date -u +%Y-%m-%d)"
          git push
      - name: Upload warehouse
        uses: actions/upload-artifact@v4
        with:
          name: climate-warehouse
          path: data/climate.duckdb
          retention-days: 14
