name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["reports/**", "docs/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and pipeline tests (offline fixtures)
        run: make test
      - name: Full run against live sources
        run: make pipeline report
      - name: Dashboard smoke test
        run: make test
